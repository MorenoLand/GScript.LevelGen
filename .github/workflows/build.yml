name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32
      - name: Build
        run: cmake --build build --config Release
      - name: Bundle
        run: cmake --install build --config Release --prefix out
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: LevelGen-windows-x86
          path: out
