name: Build LevelGen on Windows macOS and Linux

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-release
      - name: Build
        run: cmake --build --preset windows-release
      - name: Bundle
        shell: pwsh
        run: |
          cmake --install build/windows-x86-release --config Release --prefix dist/LevelGen
          Compress-Archive -Path dist/LevelGen/* -DestinationPath dist/LevelGen-windows-x86.zip -Force
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: LevelGen-windows-x86
          path: dist/LevelGen-windows-x86.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset unix-release
      - name: Build
        run: cmake --build --preset unix-release
      - name: Bundle
        run: |
          cmake --install build/unix-release --prefix dist/LevelGen
          tar -czf LevelGen-macos.tar.gz -C dist LevelGen
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: LevelGen-macos
          path: LevelGen-macos.tar.gz
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PNG dependency
        run: sudo apt-get update && sudo apt-get install -y libpng-dev ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxtst-dev libxi-dev libxss-dev libwayland-dev libxkbcommon-dev wayland-protocols libdbus-1-dev libudev-dev
      - name: Configure
        run: cmake --preset unix-release
      - name: Build
        run: cmake --build --preset unix-release
      - name: Bundle
        run: |
          cmake --install build/unix-release --prefix dist/LevelGen
          tar -czf LevelGen-linux-x64.tar.gz -C dist LevelGen
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: LevelGen-linux-x64
          path: LevelGen-linux-x64.tar.gz
          if-no-files-found: error
